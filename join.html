<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JARVIS Call</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #0a0e14; color: #d7e3f4;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .card {
    width: min(420px, 92vw); padding: 32px 28px; border-radius: 16px; text-align: center;
    background: #111823; border: 1px solid #1f2a3a; box-shadow: 0 12px 40px rgba(0, 0, 0, .5);
  }
  h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: .14em; color: #7ec8ff; }
  .sub { font-size: 12px; color: #8fa3bd; letter-spacing: .28em; text-transform: uppercase; }
  #status { font-size: 15px; margin: 22px 0; min-height: 22px; line-height: 1.4; }
  button {
    padding: 10px 22px; border-radius: 10px; border: 1px solid #2a7ab8; cursor: pointer;
    background: #12314a; color: #d7e3f4; font-size: 14px;
  }
  button:disabled { opacity: .45; cursor: default; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%;
         background: #3a4a5c; margin-right: 8px; vertical-align: middle; }
  .dot.live { background: #35d07f; box-shadow: 0 0 8px #35d07f; }
  .dot.err  { background: #e05555; }
</style>
</head>
<body>
<div class="card">
  <h1>JARVIS</h1>
  <div class="sub">incoming call</div>
  <div id="status"><span class="dot" id="dot"></span><span id="statusText">connecting…</span></div>
  <button id="micBtn" disabled>Enable microphone</button>
</div>
<script src="https://cdn.jsdelivr.net/npm/livekit-client@2/dist/livekit-client.min.js"></script>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var url = params.get("url");
  var token = params.get("token");
  var statusText = document.getElementById("statusText");
  var dot = document.getElementById("dot");
  var micBtn = document.getElementById("micBtn");
  var room = new LivekitClient.Room({ adaptiveStream: false, dynacast: false });

  function setStatus(t, cls) {
    statusText.textContent = t;
    dot.className = "dot" + (cls ? " " + cls : "");
  }

  async function connect() {
    if (!url || !token) { setStatus("Missing url/token in this link.", "err"); return; }
    setStatus("connecting to JARVIS…");
    try {
      await room.connect(url, token);
      setStatus("connected — enabling mic");
      await enableMic();
    } catch (e) {
      setStatus("connection failed: " + (e && e.message ? e.message : e), "err");
    }
  }

  async function enableMic() {
    try {
      await room.localParticipant.setMicrophoneEnabled(true);
      setStatus("live — you're talking to JARVIS", "live");
      micBtn.disabled = true;
    } catch (e) {
      setStatus("microphone blocked — tap to retry", "err");
      micBtn.disabled = false;
      micBtn.onclick = enableMic;
    }
  }

  room.on("disconnected", function () { setStatus("call ended"); });
  connect();
})();
</script>
</body>
</html>
